apiVersion: v1
kind: ConfigMap
metadata:
  name: integrationhub-config
data:
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production
  Messaging__Provider: RabbitMq
  Worker__Enabled: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Exchange: integrationhub.jobs
  RabbitMq__Queue: integrationhub.worker
  RabbitMq__RoutingKey: integration.job.submitted
  Idempotency__Provider: Redis
  Redis__Configuration: redis:6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: IntegrationHub.Api
        static_configs:
          - targets: ["api:5180"]
      - job_name: IntegrationHub.Worker
        static_configs:
          - targets: ["worker:9464"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-settings
data:
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
  GF_AUTH_DISABLE_LOGIN_FORM: "true"
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/integrationhub.json
---
