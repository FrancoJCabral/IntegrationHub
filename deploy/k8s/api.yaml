apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Replace with your published image; this registry is a placeholder.
          image: example.azurecr.io/integrationhub-api:portfolio
          ports:
            - containerPort: 5180
          envFrom:
            - configMapRef:
                name: integrationhub-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5180
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5180
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 5180
      targetPort: 5180
