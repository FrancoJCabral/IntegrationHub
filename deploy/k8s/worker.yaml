apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          # Replace with your published image; this registry is a placeholder.
          image: example.azurecr.io/integrationhub-worker:portfolio
          ports:
            - containerPort: 9464
          envFrom:
            - configMapRef:
                name: integrationhub-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:9464
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9464
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 9464
      targetPort: 9464
